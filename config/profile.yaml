career_narrative: >
  De la production motion et de la post-production à la direction artistique, puis à la
  stratégie et à la transformation créative : une trajectoire construite depuis le terrain,
  pas depuis la théorie. Cette expérience opérationnelle est le socle qui rend crédible le
  passage à un rôle de Directeur Créatif stratège plutôt qu'exécutant — quelqu'un qui a occupé
  chaque maillon de la chaîne (production, motion, direction artistique) avant de la piloter,
  et qui structure aujourd'hui cette transformation via un framework propriétaire, MCPS™ (Marko
  Creative Performance System), pensé pour diagnostiquer, transformer, piloter et mesurer la
  performance d'un système créatif dans son ensemble.
